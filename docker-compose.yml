version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: absax_postgres
    environment:
      POSTGRES_USER: absax
      POSTGRES_PASSWORD: absax_password_dev
      POSTGRES_DB: absax_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - absax_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absax"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: absax_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - absax_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  absax_network:
    driver: bridge
